# Marketing data brokers, identity/risk data companies, and international
# people-search sites. These rarely show you a public "listing", so the
# right move is a statutory deletion/opt-out request whether or not a scan
# finds you.

- slug: acxiom
  name: Acxiom
  website: https://www.acxiom.com
  domains: [acxiom.com]
  category: marketing
  regions: ["*"]
  priority: 2
  opt_out_url: https://www.acxiom.com/optout/
  methods: [form, phone]
  requires: [email_verification]
  steps:
    - US residents use the US Consumer Opt Out form.
    - France, Italy and Spain have localized portals (acxiom.com/privacy/fr, /it, /es); Germany, Austria, Switzerland and India can email Datenschutz@acxiom.com.
    - Other international requests go through Acxiom's Consumer International Rights Portal.
  notes: One of the largest marketing data brokers. Phone (877) 774-2094.

- slug: acxiom-dach
  name: Acxiom (Germany / Austria / Switzerland)
  website: https://www.acxiom.de
  domains: [acxiom.de, acxiom.com]
  category: marketing
  regions: [EU, CH]
  priority: 2
  privacy_email: Datenschutz@acxiom.com
  methods: [email]
  requires: []

