# People-search and background-check sites (mostly US).
#
# Facts (URLs, addresses, process requirements) were cross-checked against the
# brokers' own pages and community references including the Big Ass Data
# Broker Opt-Out List (github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List).
# Descriptions are our own. Brokers change their processes often: please send
# a PR when something breaks.
#
# Field reference: see src/datacleaner/brokers/__init__.py (BrokerSpec).
# search_url placeholders: {first} {last} {middle} {city} {state} {state_name} {zip}
#   transforms: :slug (lower-hyphen) :Slug (Title-Hyphen) :q (url-quote) :plus :upper :lower

- slug: beenverified
  name: BeenVerified
  website: https://www.beenverified.com
  domains: [beenverified.com]
  category: people_search
  regions: [US]
  priority: 1
  opt_out_url: https://www.beenverified.com/app/optout/search
  privacy_email: privacy@beenverified.com
  methods: [form, email]
  requires: [email_verification]
  owns: [PeopleLooker, PeopleSmart, NeighborWho, Ownerly, NumberGuru, MooseRoots]
  steps:
    - Search for yourself on the opt-out page (there is a separate property search opt-out at /app/optout/address-search).
    - Pick your record and enter your email address.
    - Click the confirmation link BeenVerified emails you.
  notes: Only one opt-out per email address; email privacy@ for additional records. Opting out here also covers PeopleLooker and PeopleSmart.

- slug: intelius
  name: Intelius (PeopleConnect)
  website: https://www.intelius.com
  domains: [intelius.com, peopleconnect.us, mailer.intelius.com]
  category: people_search
  regions: [US]
  priority: 1
  opt_out_url: https://suppression.peopleconnect.us/login
  privacy_email: support@mailer.intelius.com
  methods: [form, email, phone]
  requires: [email_verification]
  owns: [Instant Checkmate, TruthFinder, US Search, ZabaSearch, Addresses.com, AnyWho, PeopleFinder, PeopleLookup, Classmates, Spock, iSearch, LookUpAnyone, Phonesbook, PublicRecords.com, InstantPeopleFinder, DateCheck]
  steps:
    - Open the PeopleConnect Suppression Center and verify your email.
    - Search for your record(s) and suppress each one.
  notes: One suppression covers the whole PeopleConnect family (Intelius, Instant Checkmate, TruthFinder, and more). Phone 1-888-245-1655.

- slug: mylife
  name: MyLife
  website: https://www.mylife.com
  domains: [mylife.com]
  category: people_search
  regions: [US]
  priority: 1
  opt_out_url: https://www.mylife.com/privacyrequest
  privacy_email: privacy@mylife.com
  methods: [email, form, phone]
  requires: [profile_url]
  steps:
    - Find your MyLife profile and copy its URL.
    - Submit the privacy request form, or email privacy@mylife.com with your name and the profile URL.
  notes: May push you to create an account or upload ID; you don't have to. Phone (888) 704-1900.

