{% extends "base.html" %}
{% from "_macros.html" import provider_buttons %}
{% block content %}
<div class="auth-box card">
  <h1>Sign in</h1>
  {% if providers %}
    {{ provider_buttons(providers, "login", "Sign in") }}
    {% if has_password %}<div class="divider">or</div>{% endif %}
  {% endif %}
  {% if has_password or not providers %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autocomplete="username" {{ 'autofocus' if not providers }}>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <p><button class="{{ 'primary' if not providers }}" type="submit">Sign in</button></p>
  </form>
  {% endif %}
</div>
{% endblock %}
