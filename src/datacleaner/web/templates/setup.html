{% extends "base.html" %}
{% block content %}
<div class="auth-box card">
  <h1>Set up Data Cleaner</h1>
  <p class="muted">Create the admin login for this install. Everything you enter stays on this machine, encrypted at rest.</p>
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" value="admin" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
    <div class="help">At least 10 characters.</div>
    <label for="password2">Repeat password</label>
    <input id="password2" name="password2" type="password" required minlength="10" autocomplete="new-password">
    <p><button class="primary" type="submit">Create login</button></p>
  </form>
</div>
{% endblock %}
