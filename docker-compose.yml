# Self-host Data Cleaner with a private SearXNG search backend.
#
#   docker compose up -d
#   docker compose logs datacleaner     # shows your one-time setup link
#   open http://localhost:25326
#
# Only port 25326 on localhost is exposed. For access from other devices, use
# Tailscale or a reverse proxy with HTTPS and set DATACLEANER_BASE_URL.
x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m

services:
  datacleaner:
    build: .
    restart: unless-stopped
    <<: *hardening
    cap_drop:
      - ALL
    ports:
      # 25326 spells CLEAN on a phone keypad. To use another port, set DATACLEANER_PORT in .env.
      - "127.0.0.1:${DATACLEANER_PORT:-25326}:${DATACLEANER_PORT:-25326}"
    volumes:
      # A named volume (not ./data) so the non-root container owns it on every OS.
      - datacleaner-data:/data
    environment:
      DATACLEANER_PORT: ${DATACLEANER_PORT:-25326}
      DATACLEANER_SEARXNG_URL: http://searxng:8080
      # The address you open in your browser. Needed for Google/Microsoft sign-in
      # when it isn't http://localhost:25326 (https:// also turns on secure cookies + HSTS).
      DATACLEANER_BASE_URL: ${DATACLEANER_BASE_URL:-}
      # Keep the encryption key outside the data volume so a copied backup alone can't be decrypted.
      DATACLEANER_SECRET_KEY: ${DATACLEANER_SECRET_KEY:-}
      DATACLEANER_GOOGLE_CLIENT_ID: ${DATACLEANER_GOOGLE_CLIENT_ID:-}
      DATACLEANER_GOOGLE_CLIENT_SECRET: ${DATACLEANER_GOOGLE_CLIENT_SECRET:-}
      DATACLEANER_MICROSOFT_CLIENT_ID: ${DATACLEANER_MICROSOFT_CLIENT_ID:-}
      DATACLEANER_MICROSOFT_CLIENT_SECRET: ${DATACLEANER_MICROSOFT_CLIENT_SECRET:-}
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    # No published ports: only Data Cleaner can reach it.
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-long-random-string}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 512m

volumes:
  datacleaner-data:
