[project]
name = "datacleaner"
version = "0.1.0"
description = "Free, self-hosted tool to find your personal data online, get it removed from data brokers, monitor breaches, and cut off spam."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.1.4",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.63.0"]
dev = ["pytest>=9.1.1", "pip-audit>=2.10.1", "bandit>=1.9.4"]

[project.scripts]
datacleaner = "datacleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
