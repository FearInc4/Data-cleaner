[project]
name = "datacleaner"
version = "0.1.0"
description = "Free, self-hosted tool to find your personal data online, get it removed from data brokers, monitor breaches, and cut off spam."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pip-audit>=2.7", "bandit>=1.7"]

[project.scripts]
datacleaner = "datacleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
