# Minimal SearXNG config for Data Cleaner (internal use only).
use_default_settings: true

general:
  instance_name: "datacleaner-search"

server:
  # Overridden by the SEARXNG_SECRET environment variable in docker-compose.yml.
  secret_key: "change-me-to-a-long-random-string"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

ui:
  static_use_hash: true
