name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: catch newly published CVEs in unchanged code

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: datacleaner check-catalog
      - run: pytest

  extension:
    # The browser extension, loaded into real Chromium against a live server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Extension end-to-end test (must run, not skip)
        run: |
          set -o pipefail
          pytest tests/test_extension_e2e.py -rs | tee e2e.log
          ! grep -q "skipped" e2e.log

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - name: Known vulnerabilities in pinned dependencies (PyPI + OSV advisories)
        run: |
          pip-audit -r requirements.lock --require-hashes --disable-pip -s pypi
          pip-audit -r requirements.lock --require-hashes --disable-pip -s osv
      - name: Static analysis (medium and high severity)
        run: bandit -r src -ll -q
      - name: Lock file matches pyproject.toml
        run: |
          pip install uv
          # Start from the current lock so uv keeps its pins: this fails when pyproject.toml
          # changed without regenerating the lock, not whenever a dependency publishes a release.
          cp requirements.lock /tmp/requirements.lock
          uv pip compile -q pyproject.toml --python-version 3.12 --generate-hashes -o /tmp/requirements.lock
          diff <(grep -E '^[a-z0-9].*==' requirements.lock) <(grep -E '^[a-z0-9].*==' /tmp/requirements.lock) \
            || (echo "requirements.lock is stale: run the command at the top of the file" && exit 1)

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t datacleaner:ci .
      - name: Image starts read-only, unprivileged, and becomes healthy
        run: |
          docker run -d --name dc --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:25326:25326 datacleaner:ci
          for i in $(seq 1 30); do curl -sf http://localhost:25326/healthz && exit 0; sleep 1; done
          docker logs dc; exit 1
      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: datacleaner:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
